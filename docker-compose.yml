# One image, three roles: the pipeline fills the volumes, then the API and the dashboard start.
x-app: &app
  image: customer360:latest
  build: .

services:
  pipeline:
    <<: *app
    command: ["make", "pipeline"]
    restart: "no"
    volumes:
      - warehouse:/app/data
      - models:/app/mlruns

  api:
    <<: *app
    command: ["uvicorn", "services.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8010:8010"
    volumes:
      - warehouse:/app/data
      - models:/app/mlruns
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    <<: *app
    command: ["streamlit", "run", "services/dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8010
    depends_on:
      api:
        condition: service_healthy

volumes:
  warehouse:
  models:
