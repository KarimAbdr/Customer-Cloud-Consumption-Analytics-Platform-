repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: sqlfluff
        name: sqlfluff
        entry: uv run sqlfluff lint dbt/models
        language: system
        pass_filenames: false
        files: ^dbt/.*\.sql$
