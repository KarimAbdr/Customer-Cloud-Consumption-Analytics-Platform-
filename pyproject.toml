[project]
name = "customer360-platform"
version = "0.1.0"
description = "Customer 360 & cloud consumption analytics platform (bronze/silver/gold, dbt, ML, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "apache-airflow>=3.2.2",
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.5",
    "sqlfluff>=4.4.0",
    "sqlfluff-templater-dbt>=4.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["data_platform", "deploy", "ml", "services", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "lightgbm.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
