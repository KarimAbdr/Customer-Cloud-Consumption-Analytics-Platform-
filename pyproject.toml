[project]
name = "customer360-platform"
version = "0.1.0"
description = "Customer 360 & cloud consumption analytics platform (bronze/silver/gold, dbt, ML, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["data_platform", "ml", "services", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
